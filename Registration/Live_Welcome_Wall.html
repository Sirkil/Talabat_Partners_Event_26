<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Welcome Wall</title>
    <!-- Google Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Update this path if necessary to point to your new image */
            background: url('../assets/Live_Screen_bg.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        #network-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 1px;
            z-index: 5;
        }

        .node {
            position: absolute;
            /* Transform origin is dynamic based on which side of the screen it is */
            white-space: nowrap;
            color: white;
            font-size: 1.1vw;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            /* Uses the --rot variable so the animation respects your custom degree */
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            align-items: center;
            transition: all 0.4s ease;
        }

        /* Debug mode styles to help you position the containers */
        .debug-box {
            border: 1px solid red !important;
            background: rgba(255, 0, 0, 0.3) !important;
            opacity: 1 !important;
            color: yellow !important;
            justify-content: center !important;
        }

        /* Newly added active node highlight */
        .node.newly-added {
            color: #fff;
            font-size: 1.3vw;
            font-weight: 800;
            z-index: 10;
        }

        .node.newly-added .guest-badge {
            background: rgba(255, 90, 0, 0.9);
            border: 2px solid #ffffff;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 90, 0, 0.8);
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes popIn {

            /* Keep rotation intact while scaling */
            0% {
                opacity: 0;
                transform: rotate(var(--rot)) scale(0.3);
            }

            100% {
                opacity: 1;
                transform: rotate(var(--rot)) scale(1);
            }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(255, 90, 0, 0.8);
            }

            100% {
                box-shadow: 0 0 35px rgba(255, 255, 255, 1), 0 0 45px rgba(255, 90, 0, 1);
            }
        }
    </style>
</head>

<body>

    <!-- Center anchor point (0,0) -->
    <div id="network-center"></div>

    <script>
        // ==========================================
        // DEBUG MODE: Change to true to see the red boxes and adjust them
        // Change back to false for the live event
        const DEBUG_MODE = true;
        // ==========================================

        const MAX_GUESTS = 33;
        const container = document.getElementById('network-center');

        let guestList = [];
        let newlyAddedName = "";
        let lastProcessedTimestamp = 0;

        // ==========================================
        // POSITION CONFIGURATION (The 40 Lines)
        // Adjust x (vw), y (vh), width (px), height (px), and degree (rotation) for each slot.
        // x and y are distances from the dead center of the screen.
        // ==========================================
        const slotConfig = [
            // Right Side (Degrees usually between -90 and 90)
            { id: 1, x: 11, y: -19.5, width: 180, height: 35, degree: -51 },
            { id: 2, x: 17, y: -24, width: 200, height: 35, degree: -43 },
            { id: 3, x: 19, y: -19, width: 200, height: 35, degree: -33 },
            { id: 4, x: 20, y: -15, width: 200, height: 35, degree: -22 },
            { id: 5, x: 32, y: -5, width: 200, height: 35, degree: -5 },
            { id: 6, x: 34, y: 0, width: 200, height: 35, degree: 0 },
            { id: 7, x: 32, y: 5, width: 200, height: 35, degree: 5 },
            { id: 8, x: 30, y: 10, width: 200, height: 35, degree: 15 },
            { id: 9, x: 25, y: 15, width: 200, height: 35, degree: 30 },
            { id: 10, x: 20, y: 20, width: 200, height: 35, degree: 45 },
            { id: 11, x: 15, y: 25, width: 200, height: 35, degree: 60 },
            { id: 12, x: 10, y: 30, width: 200, height: 35, degree: 70 },
            { id: 13, x: 5, y: 35, width: 200, height: 35, degree: 80 },
            { id: 14, x: 35, y: -12, width: 200, height: 35, degree: -20 },
            { id: 15, x: 35, y: 12, width: 200, height: 35, degree: 20 },
            { id: 16, x: 28, y: -25, width: 200, height: 35, degree: -50 },
            { id: 17, x: 28, y: 25, width: 200, height: 35, degree: 50 },
            { id: 18, x: 18, y: -30, width: 200, height: 35, degree: -65 },
            { id: 19, x: 18, y: 30, width: 200, height: 35, degree: 65 },
            { id: 20, x: 2, y: -35, width: 200, height: 35, degree: -85 },

            // Left Side (Degrees usually between 90 and 270) 
            // Note: Keep degrees flowing normally; the code will auto-flip the text so it's readable
            { id: 21, x: -15, y: -25, width: 200, height: 35, degree: 240 },
            { id: 22, x: -20, y: -20, width: 200, height: 35, degree: 225 },
            { id: 23, x: -25, y: -15, width: 200, height: 35, degree: 210 },
            { id: 24, x: -30, y: -10, width: 200, height: 35, degree: 195 },
            { id: 25, x: -32, y: -5, width: 200, height: 35, degree: 185 },
            { id: 26, x: -34, y: 0, width: 200, height: 35, degree: 180 },
            { id: 27, x: -32, y: 5, width: 200, height: 35, degree: 175 },
            { id: 28, x: -30, y: 10, width: 200, height: 35, degree: 165 },
            { id: 29, x: -25, y: 15, width: 200, height: 35, degree: 150 },
            { id: 30, x: -20, y: 20, width: 200, height: 35, degree: 135 },
            { id: 31, x: -15, y: 25, width: 200, height: 35, degree: 120 },
            { id: 32, x: -10, y: 30, width: 200, height: 35, degree: 110 },
            { id: 33, x: -5, y: 35, width: 200, height: 35, degree: 100 },
        ];

        // If debug mode is on, instantly fill the screen with 40 placeholders
        if (DEBUG_MODE) {
            guestList = Array.from({ length: 40 }, (_, i) => `Slot ${i + 1}`);
            renderWall();
        } else {
            // Load existing stored history for live mode
            try {
                const storedAll = JSON.parse(localStorage.getItem('allGuests') || '[]');
                storedAll.forEach(g => {
                    if (g.name && !guestList.includes(g.name)) {
                        guestList.push(g.name);
                    }
                });
                if (guestList.length > MAX_GUESTS) {
                    guestList = guestList.slice(-MAX_GUESTS);
                }
            } catch (e) { }
            renderWall();
        }

        // 1. BroadcastChannel real-time sync
        if (window.BroadcastChannel) {
            const bc = new BroadcastChannel('talabat_registration');
            bc.onmessage = (event) => {
                if (!DEBUG_MODE && event.data && event.data.name) {
                    processNewSubmission(event.data.name, event.data.timestamp);
                }
            };
        }

        // 2. Storage event for cross-tab sync
        window.addEventListener('storage', (event) => {
            if (!DEBUG_MODE && event.key === 'latestGuest') {
                try {
                    const data = JSON.parse(event.newValue);
                    if (data && data.name) {
                        processNewSubmission(data.name, data.timestamp);
                    }
                } catch (e) { }
            }
        });

        // 3. Active polling loop fallback
        if (!DEBUG_MODE) {
            setInterval(() => {
                try {
                    const raw = localStorage.getItem('latestGuest');
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data && data.name && data.timestamp > lastProcessedTimestamp) {
                            processNewSubmission(data.name, data.timestamp);
                        }
                    }
                } catch (e) { }
            }, 500);
        }

        function processNewSubmission(name, timestamp) {
            if (timestamp && timestamp <= lastProcessedTimestamp) return;
            if (timestamp) lastProcessedTimestamp = timestamp;

            newlyAddedName = name;
            addGuestToWall(name);

            // Clear active highlight glow after 8 seconds
            setTimeout(() => {
                if (newlyAddedName === name) {
                    newlyAddedName = "";
                    renderWall();
                }
            }, 8000);
        }

        function addGuestToWall(name) {
            if (guestList.length >= MAX_GUESTS) {
                guestList.shift();
            }
            guestList.push(name);
            renderWall();
        }

    function renderWall() {
        container.innerHTML = '';

        guestList.forEach((name, index) => {
            // Ensure we don't exceed the configuration array length
            if (index >= slotConfig.length) return;

            const config = slotConfig[index];
            const node = document.createElement('div');
            const isNew = (name === newlyAddedName) && !DEBUG_MODE;

            node.className = isNew ? 'node newly-added' : 'node';
            if (DEBUG_MODE) node.classList.add('debug-box');

            // Apply width and height
            node.style.width = `${config.width}px`;
            node.style.height = `${config.height}px`;

            // ==========================================
            // THE FIX: Always anchor to the left edge so 
            // all boxes radiate outward predictably.
            // ==========================================
            node.style.transformOrigin = 'left center';
            node.style.left = `${config.x}vw`;
            node.style.top = `calc(${config.y}vh - ${config.height / 2}px)`;

            // Keep elements aligned properly with the line closest to the center
            node.style.justifyContent = 'flex-start';
            node.style.flexDirection = 'row';

            // Pass the degree to the CSS variable so the animation doesn't erase it
            node.style.setProperty('--rot', `${config.degree}deg`);
            node.style.transform = `rotate(${config.degree}deg)`;

            const textSpan = document.createElement('span');
            textSpan.className = 'guest-badge';
            textSpan.innerText = name;

            // Determine if this is on the left side (flip just the text for readability)
            const isLeftSide = (config.degree > 90 && config.degree < 270) || (config.degree < -90);
            if (isLeftSide) {
                textSpan.style.transform = `rotate(180deg)`;
                textSpan.style.display = 'inline-block';
            }

            node.appendChild(textSpan);
            container.appendChild(node);
        });
    }
    </script>
</body>

</html>
